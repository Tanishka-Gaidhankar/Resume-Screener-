[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume_trial"
version = "0.1.0"
description = "Frappe Custom App for AI Resume Parsing and Screening Field Autofill"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DeepMind Team", email = "developer@example.com" }
]
dependencies = [
    "requests>=2.28.0",
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["resume_trial*"]

